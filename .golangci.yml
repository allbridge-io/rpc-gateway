version: "2"

run:
  timeout: 5m
  build-tags:
    - testnet

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G404 # math/rand is fine for picking a target
    revive:
      rules:
        - name: exported
          disabled: true # doc comments are enforced by review, not by the linter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - unparam
          - revive
      - path: internal/testutil/
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
