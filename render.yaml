# Render Blueprint for the RPC gateway: one web service serves every chain.
#
# The gateway is exposed to the internet, so every route except /healthz is
# behind an API key embedded in the URL (server.api_keys in the TOML):
#   https://rpc-gateway.onrender.com/<API_KEY>/SOL
#   https://rpc-gateway.onrender.com/<API_KEY>/TRX/wallet/getnowblock
#   https://rpc-gateway.onrender.com/<API_KEY>/status
# Clients treat that URL like any keyed provider URL (Alchemy, Infura); nothing
# else changes on their side. Rotate a leaked key by listing the new one next to
# the old one in api_keys, moving the clients, then dropping the old one.
# /healthz stays public: it is the Render health check and says nothing more
# than "the process is up".
#
# Not applied automatically. Use it as the reference when creating the service
# in the Render dashboard (or "New > Blueprint Instance"), then:
#   1. Add the secret file  config.toml  with the TOML config (mounted at /etc/secrets/config.toml).
#      Secret files cannot be declared in a Blueprint; the allbridge-next-configs repo uploads
#      them with its "Upload Render Secret Files" workflow (# GROUP / # FILE header in the file).
#   2. Add env vars referenced from the TOML as ${NAME}: RPC_GATEWAY_API_KEY
#      (openssl rand -hex 32) and the provider API keys, if any.
#   3. Deploy. The service reports ready once /healthz answers; /<API_KEY>/status shows every target.
#
# Go version: Render's native Go runtime honours the `go` directive in go.mod
# (Go downloads the matching toolchain during the build), same as allbridge-next-info-server.

services:
  - type: web
    name: rpc-gateway
    runtime: go
    repo: https://github.com/allbridge-io/rpc-gateway
    branch: main
    plan: starter
    region: virginia             # any region works for a public service; kept next to the callers
    buildCommand: make build-render
    startCommand: ./app
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: CONFIG_TOML_PATH
        value: /etc/secrets/config.toml
      # Optional second file merged on top of the first one:
      # - key: SECRET_CONFIG_TOML_PATH
      #   value: /etc/secrets/secrets.toml
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: info
      # The gateway's own API key, referenced from the TOML as ${RPC_GATEWAY_API_KEY}.
      # Startup fails when it is unset, so a deploy can never come up open.
      - key: RPC_GATEWAY_API_KEY
        sync: false
      # Provider API keys referenced from the TOML as ${ALCHEMY_KEY} etc. are set in the dashboard:
      # - key: ALCHEMY_KEY
      #   sync: false
      # Logs and metrics to Grafana Cloud over OTLP (optional; unset = disabled):
      # - key: OTEL_EXPORTER_OTLP_ENDPOINT
      #   value: https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
      # - key: OTEL_EXPORTER_OTLP_HEADERS
      #   sync: false   # Authorization=Basic <base64 of instanceId:token>
      # - key: OTEL_RESOURCE_ATTRIBUTES
      #   value: deployment.environment=prod
