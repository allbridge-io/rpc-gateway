# ============================== Tron ==============================
[chains.TRX]                # Tron Shasta: full HTTP API (/wallet/*, /walletsolidity/*, /v1/*, /jsonrpc)
type = "tron"
max_block_lag = 5           # Tron blocks every 3s
[[chains.TRX.exceptions]]   # node-side failures reported with HTTP 200; client errors are passed through
match = "SERVER_BUSY"
[[chains.TRX.exceptions]]
match = "BLOCK_UNSOLIDIFIED"
[[chains.TRX.targets]]
name = "TronGrid"
http_url = "https://api.shasta.trongrid.io"   # base URL, the client's path is appended
# headers = { "TRON-PRO-API-KEY" = "${TRONGRID_KEY}" }  # TronGrid rate limits without a key

# ============================== Solana ==============================
[chains.SOL]                # Solana devnet
type = "solana"
max_block_lag = 100         # slots move every ~400ms, allow a wider gap
[[chains.SOL.exceptions]]
match = "Blockhash not found"
message = "Solana: Blockhash not found"
[[chains.SOL.exceptions]]
match = "block height exceeded"
message = "Solana: block height exceeded"
[[chains.SOL.targets]]
name = "Public"
http_url = "https://api.devnet.solana.com"
ws_url = "wss://api.devnet.solana.com"

# Chain types below are added one per anchor: a new chain's [chains.KEY]
# block goes directly under the anchor of its type.

# ---- sui ----
[chains.SUI]                # Sui testnet: one JSON-RPC endpoint, no sub-paths
type = "sui"
max_block_lag = 100         # a checkpoint every ~250ms, so 100 is about 25 seconds
[[chains.SUI.targets]]
name = "PublicNode"
http_url = "https://sui-testnet-rpc.publicnode.com"
# The Sui foundation fullnodes (fullnode.testnet.sui.io) no longer serve
# JSON-RPC; providers that still do are what this type talks to.

# ---- soroban ----
[chains.SRB]                # Stellar testnet, Soroban RPC (single JSON-RPC endpoint)
type = "soroban"
max_block_lag = 5           # ledgers close every ~5s
[[chains.SRB.targets]]
name = "SDF"
http_url = "https://soroban-testnet.stellar.org"
# headers = { "X-Api-Key" = "${SOROBAN_KEY}" }   # commercial RPCs authenticate with a header or in the URL

# ---- horizon ----
[chains.SRB_HORIZON]        # Stellar Horizon (testnet): REST API, the client's path is appended
type = "horizon"            # health check: GET <base>/ -> history_latest_ledger
max_block_lag = 5           # ledgers close every ~5s
[[chains.SRB_HORIZON.targets]]
name = "SDF"
http_url = "https://horizon-testnet.stellar.org"   # base URL, the client's path is appended
# headers = { "X-Api-Key" = "${HORIZON_KEY}" }     # commercial Horizon providers ask for one

# ---- ton ----
[chains.TON]                # TON testnet through toncenter: the v3 REST API and /api/v2/jsonRPC
type = "ton"
max_block_lag = 5           # masterchain blocks every ~5s
[[chains.TON.targets]]
name = "Toncenter"
http_url = "https://testnet.toncenter.com"   # base URL, the client's path is appended
# headers = { "X-API-Key" = "${TONCENTER_KEY}" }  # toncenter allows ~1 request/second without a key

# ---- stacks ----
[chains.STX]                # Stacks testnet through the Hiro API (it also serves the node's /v2/*)
type = "stacks"
max_block_lag = 5           # Stacks blocks are seconds apart since Nakamoto
[[chains.STX.targets]]
name = "Hiro"
http_url = "https://api.testnet.hiro.so"      # base URL, the client's path is appended
# headers = { "x-api-key" = "${HIRO_KEY}" }   # a Hiro Platform key raises the rate limit
